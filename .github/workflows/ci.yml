name: CI

# Static commands only - no interpolation of untrusted event fields anywhere.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: JS syntax
        run: |
          for f in src/*.js; do node --check "$f"; done
      - name: Validate manifest
        run: python3 -m json.tool src/manifest.json > /dev/null

  secrets:
    # Pinned gitleaks CLI binary, deliberately NOT the gitleaks GitHub Action
    # (the Action requires a license on organization-owned repositories).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download gitleaks 8.21.2
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz -o gitleaks.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
      - name: Scan full history
        run: ./gitleaks detect --source . --redact -v
